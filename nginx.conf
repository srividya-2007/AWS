# ─────────────────────────────────────────────────────────────────
# Nginx configuration for serving the React SPA on EC2
#
# USAGE:
#   sudo cp nginx.conf /etc/nginx/sites-available/aws-threatmon
#   sudo ln -s /etc/nginx/sites-available/aws-threatmon /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;   # Replace _ with your domain or EC2 public DNS

    root /var/www/html/dist;   # Path to your uploaded dist/ folder
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Security headers (AWS WAF will also enforce these)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CRITICAL: This makes React Router work on direct URL access
    # Without this, refreshing /alerts or /waf-rules will return 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Spring Boot backend
    # Remove or modify this block if frontend and backend are on separate servers
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
